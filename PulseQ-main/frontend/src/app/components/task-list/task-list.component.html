<div class="task-wrapper">

  <!-- Loading -->
  <div *ngIf="loading" class="loading">Loading tasks...</div>

  <!-- Error -->
  <div *ngIf="errorMessage" class="error">{{ errorMessage }}</div>

  <!-- Empty State -->
  <div *ngIf="!loading && tasks.length === 0" class="empty">
    No tasks yet  <br>
    Create one to get started!
  </div>

  <!-- Task List -->
  <div class="task-list" *ngIf="tasks.length > 0">
    <app-task-card
      *ngFor="let task of tasks"
      [task]="task"
      (toggle)="toggleStatus(task)"
      (delete)="deleteTask(task)">
    </app-task-card>
  </div>

</div>
