<div class="card">
  <div class="card-header">
    <h3>{{ task.title }}</h3>
    <span 
      class="status"
      [ngClass]="task.status === 'Completed' ? 'done' : 'pending'">
      {{ task.status }}
    </span>
  </div>

  <p class="desc">{{ task.description }}</p>

  <div class="actions">
    <button class="btn toggle" (click)="onToggle()">Toggle</button>
    <button class="btn delete" (click)="onDelete()">Delete</button>
  </div>
</div>
