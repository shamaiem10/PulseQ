<div class="page">
  <div class="card">

    <h2>Create Task</h2>

    <form #f="ngForm" (ngSubmit)="submit(f)" novalidate>

      <div class="field" [class.has-error]="t.invalid && t.touched">
        <input
          name="title"
          [(ngModel)]="title"
          placeholder="Task title"
          required
          #t="ngModel"
        />
        <span class="error" *ngIf="t.invalid && t.touched">Title is required</span>
      </div>

      <div class="field" [class.has-error]="d.invalid && d.touched">
        <textarea
          name="description"
          [(ngModel)]="description"
          placeholder="Task description"
          required
          #d="ngModel"
        ></textarea>
        <span class="error" *ngIf="d.invalid && d.touched">Description is required</span>
      </div>

      <span class="error" *ngIf="errorMessage">{{ errorMessage }}</span>

      <button type="submit" [disabled]="f.invalid || loading">
        {{ loading ? 'Creating...' : 'Create Task' }}
      </button>

    </form>
  </div>
</div>
